[package]
name = "lan-orangutan"
version = "3.4.2"
description = "LAN-Orangutan is a self-hosted network discovery tool. Find every device on your LAN, label and group them, snapshot your network and compare it later, and get flagged when something unexpected shows up. Single binary, no setup, Tailscale built in."
homepage = "https://github.com/291-Group/LAN-Orangutan"
license = "MIT"
arch = ["x86_64"]

[archive]
file = "orangutan-linux-amd64.tar.gz"
url = "https://github.com/291-Group/LAN-Orangutan/releases/download/v3.4.2/orangutan-linux-amd64.tar.gz"
strip_prefix = ""
