[package]
name = "omnyssh"
version = "1.1.5"
description = "Fast, open-source SSH client and server manager for macOS, Windows and Linux. Desktop GUI and terminal TUI with a live metrics dashboard, tabbed terminal, SFTP file manager, port forwarding, one-click SSH keys and snippets. Built in Rust."
homepage = "https://github.com/timhartmann7/omnyssh"
license = "Apache-2.0"
arch = ["x86_64"]

[archive]
file = "omny-x86_64-unknown-linux-gnu.tar.gz"
url = "https://github.com/timhartmann7/omnyssh/releases/download/v1.1.5/omny-x86_64-unknown-linux-gnu.tar.gz"
strip_prefix = ""
