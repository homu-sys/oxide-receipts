[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
description = "A fast, simple system package manager with a git-backed registry"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
xz2 = "0.1"
zstd = "0.13"
tar = "0.4"
walkdir = "2"
owo-colors = "4"
semver = "1"
time = { version = "0.3", features = ["formatting"] }
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
